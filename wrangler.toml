name = "newsagestoneinc"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"
build_command = "npm run build"

[vars]
NODE_VERSION = "20"
MAILGUN_DOMAIN = "sagestoneinc.com"
MAILGUN_FROM_EMAIL = "postmaster@sagestoneinc.com"
# Set MAILGUN_REGION to "eu" if your Mailgun account/domain is in the EU region.
# Omit or set to "us" for the default US region.
# MAILGUN_REGION = "us"
