name = "newsagestoneinc"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[build]
command = "npm run build"

[vars]
NODE_VERSION = "20"
FROM_EMAIL = "noreply@sagestoneinc.com"

# Cloudflare Email Routing binding — sends contact form submissions directly.
# Ensure Email Routing is enabled for your domain in the Cloudflare dashboard.
[[send_email]]
name = "SEND_EMAIL"
