<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 114" fill="none">
  <!-- Left half of top arch (sage green) -->
  <polygon points="10,34 50,11 50,24 21,41" fill="#7A8B6A"/>
  <!-- Left side strip (sage green) -->
  <polygon points="10,80 10,34 21,41 21,73" fill="#7A8B6A"/>
  <!-- Right half of top arch (stone tan) -->
  <polygon points="50,11 90,34 79,41 50,24" fill="#B8AA90"/>
  <!-- Bottom V (stone tan) -->
