  <!-- Leaf (sage green) -->
  <path d="M34,29 C47,44 48,68 34,86 C22,70 21,45 34,29 Z" fill="#7A8B6A"/>
  <path d="M34,29 C33,53 32,69 34,86" stroke="#EFE9DF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- S letterform (stone tan), angular stroke connecting arch to bottom V -->
